<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanz-App</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2233;--mu:#6b7288;--ac:#5b5bf0;--ok:#17a368;--bad:#e5484d;--bd:#e4e7f0;--warn:#e9a100;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mu:#9aa1b8;--bd:#2c3040;--ac:#7c7cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eceef6;--mu:#9aa1b8;--bd:#2c3040;--ac:#7c7cff;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mon b{font-size:18px}.mon button{width:40px}
button{font:inherit;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:9px 14px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}button.x{background:transparent;color:var(--bad);padding:4px 8px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;width:100%;min-width:0}
.r{display:flex;gap:8px;margin-top:8px}.r>*{flex:1}.r>button{flex:0 0 auto}
.l{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.l:last-child{border:0}.l small{color:var(--mu);display:block}
.big{font-size:30px;font-weight:700}.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.row{display:flex;justify-content:space-between;padding:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:transparent;color:var(--mu);font-size:12px;padding:6px 2px}nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;color:#fff}
</style></head><body><div class="w">
<h1>💸 Meine Finanzen</h1>
<div class="mon"><button class="g" onclick="mv(-1)">‹</button><b id="mt"></b><button class="g" onclick="mv(1)">›</button></div>
<div id="v"></div></div>
<nav id="nav"></nav>
<script>
var KEY="finanz-app-v1",S,tab="home",cur=new Date();cur.setDate(1);
var cats=["🛒 Essen","🚗 Mobilität","🎉 Freizeit","🛍️ Shopping","🏥 Gesundheit","💰 Sparen","📦 Sonstiges"];
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};S.salary=S.salary||0;S.fixed=S.fixed||[];S.extra=S.extra||{};S.exp=S.exp||[];S.per=S.per||{};S.goals=S.goals||[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();
var eur=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
function f(n){return eur.format(n||0)}
function id(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function iso(d){return mk(d)+"-"+String(d.getDate()).padStart(2,"0")}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}
function val(i){return document.getElementById(i).value}
function num(i){return parseFloat(String(val(i)).replace("−","-").replace(",","."))}
function sumF(){return S.fixed.reduce(function(a,b){return a+b.amount},0)}
function sumE(k){return(S.extra[k]||[]).reduce(function(a,b){return a+b.amount},0)}
function monthExp(k){return S.exp.filter(function(e){return e.date.slice(0,7)===k})}
function sumX(a){return a.reduce(function(s,e){return s+e.amount},0)}
function set(t){tab=t;render()}
function setSalary(){var n=num("sal");if(isNaN(n))return;S.salary=n;save();render()}
function addFixed(){var n=val("fn").trim(),a=num("fa");if(!n||isNaN(a)||a<=0)return;S.fixed.push({id:id(),name:n,amount:a});save();render()}
function addExtra(){var a=num("ea"),k=mk(cur);if(isNaN(a)||a===0)return;(S.extra[k]=S.extra[k]||[]).push({id:id(),note:val("en").trim()||"Extra",amount:a});save();render()}
function addExp(){var n=val("xn").trim(),a=num("xa");if(!n||isNaN(a)||a<=0)return;var d=val("xd")||iso(new Date());var c=val("xc"),e={id:id(),name:n,amount:a,date:d,cat:c};if(c.indexOf("Sparen")>-1)e.alloc=alloc(a);S.exp.push(e);save();render()}
function addPer(){var a=num("pb"),s=val("ps"),e=val("pe");if(isNaN(a)||!s||!e||e<s)return;var k=mk(cur);(S.per[k]=S.per[k]||[]).push({id:id(),name:val("pn").trim()||"Periode",start:s,end:e,budget:a});save();render()}
function quick(pid){var a=parseFloat(String(document.getElementById("q"+pid).value).replace(",","."));if(isNaN(a)||a<=0)return;var p=S.per[mk(cur)].filter(function(x){return x.id===pid})[0];var t=iso(new Date());var d=t<p.start?p.start:(t>p.end?p.end:t);S.exp.push({id:id(),name:p.name,amount:a,date:d,cat:"📦 Sonstiges"});save();render()}
function del(w,i,k){if(w==="fixed")S.fixed=S.fixed.filter(function(x){return x.id!==i});
if(w==="extra")S.extra[k]=S.extra[k].filter(function(x){return x.id!==i});
if(w==="exp"){S.exp.filter(function(x){return x.id===i}).forEach(function(x){(x.alloc||[]).forEach(function(al){S.goals.forEach(function(g){if(g.id===al.id)g.saved=Math.max(0,Math.round((g.saved-al.amt)*100)/100)})})});S.exp=S.exp.filter(function(x){return x.id!==i})}
if(w==="per")S.per[k]=S.per[k].filter(function(x){return x.id!==i});
if(w==="goal")S.goals=S.goals.filter(function(x){return x.id!==i});save();render()}
function addGoal(){var n=val("gn").trim(),t=num("gt");if(!n||isNaN(t)||t<=0)return;S.goals.push({id:id(),name:n,target:t,saved:0,due:val("gd")||""});save();render()}
function goalAdd(i){var a=num("g"+i);if(isNaN(a))return;var g=S.goals.filter(function(x){return x.id===i})[0];g.saved=Math.max(0,g.saved+a);save();render()}
function alloc(a){var g=S.goals.filter(function(x){return x.target-x.saved>0}),t=g.reduce(function(s,x){return s+x.target-x.saved},0),res=[];if(!t)return res;g.forEach(function(x){var n=x.target-x.saved,p=Math.min(n,Math.round(a*n/t*100)/100);if(p>0){x.saved=Math.round((x.saved+p)*100)/100;res.push({id:x.id,name:x.name,amt:p})}});return res}
function sg(i){var e=document.getElementById(i),v=e.value.trim();e.value=v.charAt(0)==="-"?v.slice(1):"-"+v}
function months(g){if(!g.due)return 0;var d=(new Date(g.due)-new Date())/864e5;return Math.max(1,Math.ceil(d/30.44))}
function rate(g){var m=months(g);return m?Math.max(0,g.target-g.saved)/m:0}
function sumS(){return S.goals.reduce(function(a,g){return a+rate(g)},0)}
function setUnit(u){S.unit=u;save();render()}
function bud(){var k=mk(cur),ic=S.salary+sumE(k),fx=sumF(),sv=sumS(),B=ic-fx-sv,dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),xs=sumX(monthExp(k)),u=S.unit||"tag",t=new Date(),dl=mk(t)===k?dim-t.getDate()+1:dim,m=u==="tag"?1:7,per=B/dim*m,rem=B-xs,rp=rem/dl*m,un=u==="tag"?"Tag":"Woche";
return'<div class="card"><h2>📊 Monatsbudget</h2><div class="r"><button class="'+(u==="tag"?"":"g")+'" onclick="setUnit(\'tag\')">Pro Tag</button><button class="'+(u==="woche"?"":"g")+'" onclick="setUnit(\'woche\')">Pro Woche</button></div>'+
'<div class="row" style="margin-top:10px"><span>Einkommen</span><b>'+f(ic)+'</b></div><div class="row"><span>🏠 Fixkosten</span><b>− '+f(fx)+'</b></div><div class="row"><span>🎯 Sparraten (Ziele mit Frist)</span><b>− '+f(sv)+'</b></div><div class="row"><span>= Budget im Monat</span><b class="'+(B<0?"bad":"")+'">'+f(B)+'</b></div></div>'+
'<div class="card"><div class="mu">Dein Budget pro '+un+'</div><div class="big '+(per<0?"bad":"ok")+'">'+f(per)+'</div><div class="mu">'+dim+' Tage im Monat</div>'+bar(B>0?xs/B*100:100,rem<0)+'<div class="row"><span>Bisher ausgegeben</span><b>'+f(xs)+'</b></div><div class="row"><span>Noch übrig im Monat</span><b class="'+(rem<0?"bad":"ok")+'">'+f(rem)+'</b></div><div class="row"><span>Noch pro '+un+' verfügbar ('+dl+' Tage übrig)</span><b class="'+(rp<0?"bad":"ok")+'">'+f(rp)+'</b></div></div>'}
function bar(p,bad){return'<div class="bar"><i style="width:'+Math.min(100,Math.max(0,p))+'%;background:'+(bad?"var(--bad)":p>80?"var(--warn)":"var(--ok)")+'"></i></div>'}
function home(){var k=mk(cur),ex=sumE(k),inc=S.salary+ex,fx=sumF(),xs=sumX(monthExp(k)),sv=sumS(),free=inc-fx-sv,rest=free-xs;
return'<div class="card"><div class="mu">Verfügbar nach Fixkosten &amp; Ausgaben</div><div class="big '+(rest<0?"bad":"ok")+'">'+f(rest)+'</div>'+bar(inc>0?(fx+sv+xs)/inc*100:0,rest<0)+'</div>'+
'<div class="card"><div class="row"><span>💼 Gehalt</span><b>'+f(S.salary)+'</b></div><div class="row"><span>✨ Extraeinkommen</span><b class="'+(ex<0?"bad":"")+'">'+f(ex)+'</b></div><div class="row"><span>= Einkommen im Monat</span><b>'+f(inc)+'</b></div><div class="row"><span>🏠 Fixkosten (automatisch)</span><b>− '+f(fx)+'</b></div><div class="row"><span>🎯 Sparraten (für Ziele)</span><b>− '+f(sv)+'</b></div><div class="row"><span>💰 Frei verfügbar</span><b>'+f(free)+'</b></div><div class="row"><span>🧾 Ausgaben im Monat</span><b>− '+f(xs)+'</b></div></div>'+
'<div class="card"><h2>🎯 Sparziele</h2>'+S.goals.map(function(g){var p=g.saved/g.target*100;return'<div class="l" style="display:block"><div class="row"><b>'+esc(g.name)+'</b><button class="x" onclick="del(\'goal\',\''+g.id+'\')">✕</button></div>'+bar(p)+'<div class="row mu"><span>'+f(g.saved)+' von '+f(g.target)+'</span><span>'+Math.round(p)+' %</span></div><div class="row mu"><span>'+(g.due?'Frist: '+g.due.split("-").reverse().join(".")+' · sparen: <b>'+f(rate(g))+'</b>/Monat':'Keine Frist gesetzt')+'</span></div><div class="r"><input id="g'+g.id+'" inputmode="decimal" placeholder="± Betrag"><button class="g" onclick="sg(\'g'+g.id+'\')">±</button><button onclick="goalAdd(\''+g.id+'\')">Einzahlen</button></div></div>'}).join("")+
'<div class="r"><input id="gn" placeholder="Neues Ziel, z. B. Urlaub 🏖️"></div><div class="mu" style="margin-top:8px">Zielbetrag und Frist (bis wann gespart sein soll)</div><div class="r"><input id="gt" inputmode="decimal" placeholder="Ziel €"><input id="gd" type="date"><button onclick="addGoal()">+</button></div></div>'}
function inc(){var k=mk(cur),ex=S.extra[k]||[];
return'<div class="card"><h2>💼 Gehalt</h2><div class="mu">Einmal eintragen – gilt automatisch jeden Monat.</div><div class="r"><input id="sal" inputmode="decimal" value="'+(S.salary||"")+'" placeholder="Monatsgehalt €"><button onclick="setSalary()">Speichern</button></div></div>'+
'<div class="card"><h2>✨ Extraeinkommen</h2><div class="mu">Nur für diesen Monat. Mehr verdient: Plus. Weniger verdient: Minus eintragen (z. B. −150).</div>'+
ex.map(function(e){return'<div class="l"><span>'+esc(e.note)+'</span><span><b class="'+(e.amount<0?"bad":"ok")+'">'+(e.amount>0?"+":"")+f(e.amount)+'</b><button class="x" onclick="del(\'extra\',\''+e.id+'\',\''+k+'\')">✕</button></span></div>'}).join("")+
'<div class="r"><input id="en" placeholder="Notiz (optional)"><input id="ea" inputmode="decimal" placeholder="± Betrag"><button class="g" onclick="sg(\'ea\')">±</button><button onclick="addExtra()">+</button></div></div>'+
'<div class="card"><h2>💾 Sicherung</h2><div class="mu">Alte Sicherung (.json) importieren oder aktuelle Daten sichern.</div><div class="r"><input type="file" accept=".json" onchange="imp(event)"><button class="g" onclick="dl()">Sichern</button></div></div>'}
function fix(){return'<div class="card"><h2>🏠 Fixkosten</h2><div class="mu">Einmal hinzufügen – wird jeden Monat automatisch abgezogen.</div>'+
S.fixed.map(function(x){return'<div class="l"><span>'+esc(x.name)+'</span><span><b>'+f(x.amount)+'</b><button class="x" onclick="del(\'fixed\',\''+x.id+'\')">✕</button></span></div>'}).join("")+
'<div class="l"><b>Summe pro Monat</b><b>'+f(sumF())+'</b></div><div class="r"><input id="fn" placeholder="z. B. Miete 🏡"><input id="fa" inputmode="decimal" placeholder="€"><button onclick="addFixed()">+</button></div></div>'}
function exps(){var k=mk(cur),l=monthExp(k).sort(function(a,b){return a.date<b.date?1:-1});
return'<div class="card"><h2>🧾 Ausgabe eintragen</h2><div class="mu">Kategorie „💰 Sparen“ teilt den Betrag automatisch auf deine Sparziele auf.</div><input id="xn" placeholder="Wofür?"><div class="r"><input id="xa" inputmode="decimal" placeholder="€"><select id="xc">'+cats.map(function(c){return"<option>"+c+"</option>"}).join("")+'</select></div><div class="r"><input id="xd" type="date" value="'+iso(new Date())+'"><button onclick="addExp()">Hinzufügen</button></div></div>'+
'<div class="card"><h2>Ausgaben im Monat: '+f(sumX(l))+'</h2>'+(l.length?l.map(function(e){return'<div class="l"><span>'+esc(e.name)+'<small>'+e.cat+' · '+e.date.split("-").reverse().join(".")+(e.alloc&&e.alloc.length?'<br>→ '+e.alloc.map(function(a){return esc(a.name)+' '+f(a.amt)}).join(", "):(e.cat.indexOf("Sparen")>-1?'<br>Kein offenes Sparziel':''))+'</small></span><span><b>'+f(e.amount)+'</b><button class="x" onclick="del(\'exp\',\''+e.id+'\')">✕</button></span></div>'}).join(""):'<div class="mu">Noch nichts eingetragen.</div>')+'</div>'}
function pers(){var k=mk(cur),l=(S.per[k]||[]).slice().sort(function(a,b){return a.start<b.start?-1:1});var first=iso(cur),last=iso(new Date(cur.getFullYear(),cur.getMonth()+1,0));
return'<div class="card"><h2>📅 Neue Zeitperiode</h2><div class="mu">Teile dir den Monat ein (5 Tage, 1 oder 2 Wochen …) und setze ein Zielbudget.</div><input id="pn" placeholder="Name, z. B. Woche 1"><div class="r"><input id="ps" type="date" value="'+first+'"><input id="pe" type="date" value="'+last+'"></div><div class="r"><input id="pb" inputmode="decimal" placeholder="Zielbudget €"><button onclick="addPer()">Anlegen</button></div></div>'+
l.map(function(p){var sp=sumX(S.exp.filter(function(e){return e.date>=p.start&&e.date<=p.end})),left=p.budget-sp,pc=p.budget>0?sp/p.budget*100:0,bad=left<0;
return'<div class="card"><div class="row"><b>'+esc(p.name)+'</b><span><span class="pill" style="background:'+(bad?"var(--bad)":"var(--ok)")+'">'+(bad?"Über Budget":"Im Budget")+'</span><button class="x" onclick="del(\'per\',\''+p.id+'\',\''+k+'\')">✕</button></span></div><div class="mu">'+p.start.split("-").reverse().join(".")+' – '+p.end.split("-").reverse().join(".")+'</div>'+bar(pc,bad)+
'<div class="row"><span>Ausgegeben</span><b>'+f(sp)+' / '+f(p.budget)+'</b></div><div class="row"><span>'+(bad?"Überzogen um":"Noch übrig")+'</span><b class="'+(bad?"bad":"ok")+'">'+f(Math.abs(left))+'</b></div><div class="r"><input id="q'+p.id+'" inputmode="decimal" placeholder="Ausgegeben € hinzufügen"><button onclick="quick(\''+p.id+'\')">+</button></div></div>'}).join("")}
function imp(ev){var fl=ev.target.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);(d.tx||[]).forEach(function(t){if(t.type==="in"){if(t.cat==="Gehalt"){S.salary=t.amt}else{var k=t.date.slice(0,7);(S.extra[k]=S.extra[k]||[]).push({id:id(),note:t.note||t.cat,amount:t.amt})}}else{S.exp.push({id:id(),name:t.note||t.cat,amount:t.amt,date:t.date,cat:t.cat})}});(d.goals||[]).forEach(function(g){if(g.target>0)S.goals.push({id:id(),name:g.name||"Ziel",target:g.target,saved:g.saved||0})});save();render();alert("Import fertig")}catch(e){alert("Datei konnte nicht gelesen werden")}};r.readAsText(fl)}
function dl(){var a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S));a.download="finanzen-sicherung.json";a.click()}
function render(){var T=[["home","🏠","Übersicht"],["inc","💼","Gehalt"],["fix","📌","Fixkosten"],["exps","🧾","Ausgaben"],["pers","📊","Budget"]];
document.getElementById("nav").innerHTML=T.map(function(t){return'<button class="'+(t[0]===tab?"on":"")+'" onclick="set(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
document.getElementById("mt").textContent=cur.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
document.getElementById("v").innerHTML={home:home,inc:inc,fix:fix,exps:exps,pers:function(){return bud()+pers()}}[tab]()}
render();
</script></body></html>
